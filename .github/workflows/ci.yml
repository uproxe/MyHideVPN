name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Сборка
        run: python3 tools/build.py

      - name: Линтер (shellcheck закреплённой версии, чтобы обновления образа не ломали сборку)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}:$PATH"
          shellcheck --version | sed -n 2p
          make lint

      - name: Сквозные тесты мастера (имитация серверов)
        run: sudo -E bash tests/e2e.sh

      - name: Xray и списки runetfreedom для проверки конфигов
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          cd "$RUNNER_TEMP/xray"
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -oq xray.zip xray
          curl -fsSL -o geoip.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o geosite.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          ./xray version | head -1

      - name: Проверка всех вариантов конфигов настоящим Xray
        run: XRAY_DIR="$RUNNER_TEMP/xray" bash tests/validate-configs.sh

      - uses: actions/upload-artifact@v6
        with:
          name: vless-setup
          path: dist/vless-setup.sh

  release:
    # Релиз создаётся сам: при пуше в main, если релиза с версией из файла VERSION ещё нет,
    # или при пуше тега vX.Y.Z. Чтобы выпустить новую версию — поменяйте число в VERSION.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Версия и нужен ли релиз
        id: v
        run: |
          TAG="v$(tr -d ' \r\n' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "тег $GITHUB_REF_NAME, а в VERSION $TAG"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "релиз $TAG уже есть — пропускаю"; echo "need=0" >> "$GITHUB_OUTPUT"
          else
            echo "need=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        if: steps.v.outputs.need == '1'
        run: |
          python3 tools/build.py
          cd dist && sha256sum vless-setup.sh > vless-setup.sh.sha256

      - name: Релиз с готовым файлом
        if: steps.v.outputs.need == '1'
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/vless-setup.sh dist/vless-setup.sh.sha256 \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes
